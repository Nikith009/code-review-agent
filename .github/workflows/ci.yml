name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the live GitHub tests diff against the first commit
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q -rs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    # the real CLI against GitHub; needs no Anthropic key because it only checks wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: CLI is installed and fails cleanly without an API key
        run: |
          review-agent --help
          if review-agent review --repo "$GITHUB_REPOSITORY" --pr 1 --dry-run 2> err.txt; then
            echo "expected a missing-key error"; exit 1
          fi
          grep -q "ANTHROPIC_API_KEY is not set" err.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ""
